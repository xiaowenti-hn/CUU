[project]
name = "qa-platform"
version = "0.1.0"
description = "本机验收平台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qa_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
